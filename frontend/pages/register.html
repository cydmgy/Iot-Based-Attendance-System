<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication — Register — BPES</title>
</head>
<body>

<div id="screen-register" class="figma-split-container">
  
  <!-- Left: 710px Campus Panel (Figma Desktop) -->
  <div class="figma-campus-panel">
    <div class="figma-campus-header">
      <div class="figma-brand-logo">
        <i class="fas fa-graduation-cap"></i>
      </div>
      <div class="figma-brand-text">BPES Portal</div>
    </div>

    <div class="figma-campus-copy">
      <h2>Your school, connected</h2>
      <p>A shared school portal for administrators, teachers, and students.</p>
    </div>
  </div>

  <!-- Right: Form Panel with Exact Register Card -->
  <div class="figma-form-panel">
    
    <!-- Top Bar with Back Button -->
    <div class="figma-auth-topbar">
      <div class="d-flex align-items-center gap-2">
        <div class="bpes-logo-icon" style="background: var(--color-primary-light); color: var(--color-primary);">
          <i class="fas fa-graduation-cap"></i>
        </div>
        <span class="fw-bold" style="font-family: var(--font-brand); font-size: 20px; color: var(--color-primary);">BPES Portal</span>
      </div>

      <button class="figma-auth-back-btn" onclick="loadPage('welcome')" title="Return to Portal Welcome">
        <i class="fas fa-arrow-left"></i>
        <span>Back</span>
      </button>
    </div>

    <!-- Center Card Wrapper -->
    <div class="figma-card-wrapper">
      <div class="figma-auth-card">
        
        <div class="card-header border-0 bg-transparent p-0 mb-4">
          <h1 class="figma-auth-card-title">Create an account</h1>
          <p class="figma-auth-card-subtitle mb-0">Create your school portal account.</p>
        </div>

        <div id="register-alert"></div>

        <form id="register-form" onsubmit="handleUnifiedRegister(event)">
          
          <div class="bpes-form-group">
            <label for="reg-username" class="bpes-label">Student ID / LRN</label>
            <div class="bpes-input-wrapper">
              <i class="fas fa-id-card bpes-input-icon"></i>
              <input type="text" id="reg-username" class="bpes-input with-icon" placeholder="Enter your LRN or Student ID" required autocomplete="username">
            </div>
          </div>

          <div class="bpes-form-group">
            <label for="reg-fullname" class="bpes-label">Full Name</label>
            <div class="bpes-input-wrapper">
              <i class="fas fa-user bpes-input-icon"></i>
              <input type="text" id="reg-fullname" class="bpes-input with-icon" placeholder="Enter your full name" required autocomplete="name">
            </div>
          </div>

          <div class="bpes-form-group">
            <label for="reg-email" class="bpes-label">Email Address</label>
            <div class="bpes-input-wrapper">
              <i class="fas fa-envelope bpes-input-icon"></i>
              <input type="email" id="reg-email" class="bpes-input with-icon" placeholder="you@school.edu" required autocomplete="email">
            </div>
          </div>

          <div class="bpes-form-group">
            <label for="reg-password" class="bpes-label">Password</label>
            <div class="bpes-input-wrapper">
              <i class="fas fa-lock bpes-input-icon"></i>
              <input type="password" id="reg-password" class="bpes-input with-icon" placeholder="••••••••" required autocomplete="new-password">
            </div>
          </div>

          <div class="bpes-form-group">
            <label for="reg-confirm-password" class="bpes-label">Confirm Password</label>
            <div class="bpes-input-wrapper">
              <i class="fas fa-key bpes-input-icon"></i>
              <input type="password" id="reg-confirm-password" class="bpes-input with-icon" placeholder="••••••••" required autocomplete="new-password">
            </div>
          </div>

          <button type="submit" id="btn-submit-register" class="bpes-btn-primary w-100 py-3 mt-3" style="border-radius: var(--radius-input);">
            <span>Create Account</span>
          </button>
        </form>

        <div class="text-center mt-4 pt-2" style="font-size: 14px;">
          <span style="color: var(--color-text-secondary);">Already have an account? </span>
          <a href="#login" class="fw-bold" style="color: var(--color-primary);" onclick="loadPage('login')">
            Login
          </a>
        </div>

      </div>
    </div>

  </div>

</div>

</body>
</html>
