<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BPES Portal - Batasan Paaralang Elementarya ng San RFID Attendance Monitoring & School Management System">
  <title>BPES Portal — Batasan Paaralang Elementarya ng San</title>
  
  <!-- Google Fonts: Inter & Italiana -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Italiana&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Bootstrap 5 CSS (Base Grid & Modal utilities) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Custom Figma Green Redesign Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Application Root Shell -->
  <div id="app"></div>

  <!-- Shared Global Mobile Navigation Drawer -->
  <div id="bpes-global-drawer-backdrop" class="bpes-drawer-backdrop" onclick="toggleMobileDrawer(false)"></div>
  <aside id="bpes-global-drawer" class="bpes-drawer" aria-label="Mobile Navigation Drawer">
    <div class="bpes-drawer-header">
      <div id="drawer-context-label" class="bpes-drawer-context">BPES PORTAL</div>
      <h2 id="drawer-title-label" class="bpes-drawer-title">Navigation</h2>
      <button class="bpes-drawer-close" onclick="toggleMobileDrawer(false)" aria-label="Close navigation drawer">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <nav class="bpes-drawer-nav" id="drawer-nav-items">
      <!-- Injected dynamically per portal role -->
    </nav>
    <div class="bpes-drawer-footer">
      <button class="bpes-btn-danger-outline w-100 justify-content-center" onclick="logout()">
        <i class="fas fa-arrow-right-from-bracket me-2"></i> Log Out
      </button>
    </div>
  </aside>

  <!-- Reusable BPES Authentication Feedback Modal -->
  <div id="bpes-auth-modal-backdrop" class="bpes-auth-modal-backdrop" onclick="closeAuthErrorPopup()">
    <div class="bpes-auth-modal" onclick="event.stopPropagation()">
      <button type="button" class="bpes-auth-modal-close" onclick="closeAuthErrorPopup()" aria-label="Close dialog">
        <i class="fas fa-times"></i>
      </button>
      <div id="bpes-auth-modal-icon-wrap" class="bpes-auth-modal-icon not-found mb-3">
        <i class="fas fa-user-xmark"></i>
      </div>
      <h3 id="bpes-auth-modal-title" class="bpes-auth-modal-title">Account Not Found</h3>
      <p id="bpes-auth-modal-message" class="bpes-auth-modal-desc mb-4">
        We could not find an account with the credentials provided.
      </p>
      <div id="bpes-auth-modal-actions" class="d-flex flex-column gap-2">
        <!-- Buttons injected dynamically -->
      </div>
    </div>
  </div>

  <!-- External Libraries: Axios & Bootstrap 5 Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Modular Portal Scripts -->
  <script src="js/student.js"></script>
  <script src="js/teacher.js"></script>
  <script src="js/admin.js"></script>
  
  <!-- Main Application Router & Shared State -->
  <script src="js/app.js"></script>
</body>
</html>
